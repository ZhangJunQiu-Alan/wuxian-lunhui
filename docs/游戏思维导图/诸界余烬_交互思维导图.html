": "通关额外奖励：400 奖励点；解锁第三关", "children": []}]}, {"text": "第三关 · 最后之战｜维格利德", "children": [{"text": "地图：5120 × 5120；燃烧平原、彩虹桥残端、巨人残骸、霜巨人残部、穆斯贝尔前线", "children": []}, {"text": "敌群：亡者、火焰巨人、霜巨人精锐、狂狼战士", "children": []}, {"text": "火焰巨人：死亡爆炸并留下火地；霜巨人精锐：冲锋、正面举盾；狂狼战士：残血狂暴", "children": []}, {"text": "03:00 · 耶梦加得：只有蛇头受伤，蛇身撞飞，收紧包围，喷毒", "children": []}, {"text": "06:00 · 芬里尔：吸引吞噬、绕圈奔袭；拾取格莱普尼尔碎片可束缚", "children": []}, {"text": "09:00 · 苏尔特：炎剑横扫、召唤火巨人；60% 九界燃烧，25% 终焉符文安全格", "children": []}, {"text": "无普通支线、无隐藏支线；重心为战场援助与命运事件", "children": []}, {"text": "全部 Boss 击败 → 篇章结局字幕 → 通关结算", "children": []}, {"text": "通关额外奖励：500 奖励点", "children": []}]}, {"text": "第三关 · 改写命运", "children": [{"text": "托尔获救：信仰托尔＋巨蛇遭遇战用时不超过 90 秒击败；不要求托尔觉醒", "children": []}, {"text": "托尔后续：苏尔特战每 6 秒额外落雷援助", "children": []}, {"text": "维达介入：奥丁觉醒＋芬里尔巨口战斗触发；实际撕口后记录", "children": []}, {"text": "弗雷参战：弗蕾亚觉醒＋进入苏尔特战；援军到场后记录，每 4 秒治疗 6% 最大生命", "children": []}, {"text": "普通神明援助：附近有交战时，每约 14 秒轮流请一位已信仰的神出手", "children": []}, {"text": "命运结果参与展示与持久记录；当前每项额外奖励点配置为 0", "children": []}, {"text": "本局信仰过洛基：通关结算有额外伏笔文本", "children": []}]}]}, {"text": "07 · 支线、探索与补给", "children": [{"text": "支线共同规则", "children": [{"text": "普通支线：01:40／04:30／07:30 从本关池随机抽取，Boss 在场时顺延", "children": []}, {"text": "光柱出现后靠近接受；40 秒不接受则错过", "children": []}, {"text": "隐藏支线：开局藏于地标，00:30 后可触发，未发现会给线索", "children": []}, {"text": "同时最多 1 个普通支线＋1 个隐藏支线", "children": []}, {"text": "支线可有期限与挑战代价；完成给资源或本局增益", "children": []}, {"text": "下列“选卡”为独立奖励选择，不增加玩家等级", "children": []}]}, {"text": "第一关 · 9 个普通支线", "children": [{"text": "最后的篝火：篝火附近守护累计 45 秒 → 100 点＋回满生命", "children": []}, {"text": "奥丁的渡鸦：找到并安抚两只渡鸦 → 剧情点 1＋80 点；信仰奥丁额外选卡，否则大招能量 +50%", "children": []}, {"text": "瓦尔基里的试炼：加快刷怪，60 秒内击杀 150 个敌人 → 100 点＋选卡", "children": []}, {"text": "死者的指甲：收集 30 个指甲 → 剧情点 1＋80 点", "children": []}, {"text": "冰下的战士：限时打碎冰块 → 100 点＋选卡", "children": []}, {"text": "霜巨人的祭司：击杀祭司 → 120 点＋宝箱", "children": []}, {"text": "芬布尔寒潮：围绕火盆保持体温，撑过 60 秒 → 100 点＋选卡", "children": []}, {"text": "命运之线：从灰线与另外两条随机线中选一条 <script>
'use strict';
const data=JSON.parse(document.getElementById('map-data').textContent);
const nav=document.querySelector('.nav'), panels=document.getElementById('panels'), status=document.getElementById('status');
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function childList(nodes,depth=0){const ul=el('ul');for(const n of nodes){const li=el('li');if(n.children.length){const d=el('details');d.open=depth<1;d.append(el('summary',n.text));d.append(childList(n.children,depth+1));li.append(d)}else li.append(el('span',n.text));ul.append(li)}return ul}

data.sections.forEach((s,i)=>{const panel=el('section',undefined,'panel');panel.dataset.id=String(i);panel.id=`branch-${i}`;panel.hidden=true;const head=el('div',undefined,'panel-head'),titles=el('div');titles.append(el('h2',s.text),el('p',data.sub[i]));const tools=el('div',undefined,'tools');for(const [label,open]of [['展开本支全部',true],['收起细节',false]]){const b=el('button',label);b.type='button';b.onclick=()=>{panel.querySelectorAll('details').forEach(d=>d.open=open||d.classList.contains('branch'));status.textContent=open?'本分支全部节点已展开':'保留主分类，细节已收起'};tools.append(b)}const print=el('button','打印全部');print.type='button';print.onclick=()=>window.print();tools.append(print);head.append(titles,tools);panel.append(head,el('div',`诸界余烬 → ${data.short[i]}`,'tree-root'));const branches=el('div',undefined,'branches');s.children.forEach(n=>{const d=el('details',undefined,'branch');d.open=true;d.append(el('summary',n.text),childList(n.children));branches.append(d)});panel.append(branches);if(i===4)panel.append(el('p','读法：基础神术 → 四方向强化 → 信仰 6 选择一条质变 → 信仰 12 对应觉醒 → 两神觉醒后融合。','note'));panels.append(panel)});
const sourceList=document.querySelector('#sources ul');for(const n of data.sources.children)sourceList.append(el('li',n.text));
function select(id,update=true){if(!views.includes(id))id='overview';document.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.id!==id);nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.target===id)));status.textContent=id==='overview'?'':`当前：${data.short[Number(id)]} · ${data.counts[Number(id)]} 个内容节点`;if(update)history.replaceState(null,'','#'+id)}

let printed=[];window.addEventListener('beforeprint',()=>{printed=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printed.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>printed.forEach(([d,open])=>d.open=open));
select(location.hash.slice(1)||'overview',false);
