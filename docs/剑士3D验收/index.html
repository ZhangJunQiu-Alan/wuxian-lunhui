<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101924">
  <title>剑士 3D 试点 · 阶段 3 基础模型</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="review.js?v=5" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="#top">诸界余烬<span>角色验收</span></a>
      <nav class="history-links" aria-label="反馈记录">
        <a class="quiet-link" href="api/review" download="剑士3D-反馈.json">下载反馈</a>
      </nav>
    </div>
  </header>
  <main id="top">
    <section class="hero wrap" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">剑士 3D 试点 · 阶段 3</p>
        <h1 id="page-title">基础模型</h1>
        <p class="hero-summary">身体模型改成不带武器，用 Tripo Pro 生成了两个 3D 候选，我在 Blender 里检查、挑了一个修整定稿。这一轮看四件事：无武器设定图、候选选择、定稿模型，以及阶段 4 的绑骨方案。</p>
        <a class="primary" href="#unarmed">开始验收</a>
      </div>
      <figure class="hero-art">
        <img src="media/定稿转台.webp" alt="剑士 3D 基础模型八个角度的转台图" width="1800" height="1125" fetchpriority="high">
        <figcaption>定稿模型 · 八个角度</figcaption>
      </figure>
    </section>
    <div class="wrap review-shell">
      <aside class="sidebar" aria-label="验收导航">
        <p class="eyebrow">验收进度</p>
        <p id="progress" class="progress" aria-live="polite">加载中</p>
        <p class="review-history">阶段 1、2 已通过。点图片可看原图。</p>
        <nav id="sections" aria-label="验收项目"></nav>
      </aside>
      <div id="work" class="work"></div>
    </div>
  </main>
  <template id="review-item">
    <section class="work-item">
      <header class="item-head">
        <div><h2></h2><p class="description"></p></div>
        <span class="item-status"></span>
      </header>
      <div class="evidence"></div>
      <form>
        <fieldset>
          <legend>验收结果</legend>
          <div class="decisions">
            <label><input type="radio" name="status" value="pending" checked><span>待验收</span></label>
            <label><input type="radio" name="status" value="approved"><span>通过</span></label>
            <label><input type="radio" name="status" value="revise"><span>需修改</span></label>
          </div>
        </fieldset>
        <label class="note-label">意见<textarea name="note" rows="3" maxlength="3000" placeholder="需要调整的地方和期望效果"></textarea></label>
        <div class="form-footer"><button type="submit">保存反馈</button><span class="save-result" role="status"></span></div>
      </form>
    </section>
  </template>
</body>
</html>
