<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101924">
  <title>冻石庭院 · 轮次 09 复验</title>
  <link rel="stylesheet" href="style.css">
  <script src="review.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="#top">诸界余烬<span>场景验收</span></a>
      <nav class="history-links" aria-label="反馈记录">
        <a class="quiet-link" href="api/review" download="冻石庭院-轮次09反馈.json">下载反馈</a>
      </nav>
    </div>
  </header>
  <main id="top">
    <section class="hero wrap" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">芬布尔之冬 · 轮次 09 复验</p>
        <h1 id="page-title">冻石庭院</h1>
        <p class="hero-summary">轮次 08 的八项里，六项已经通过。这一页只复验你提的两处修改：入口火盆穿模，以及出口改成碰到光门就离开。</p>
        <a class="primary" href="#brazier">开始验收</a>
      </div>
      <figure class="hero-art">
        <img src="media/r9-brazier-entry.webp" alt="Godot 实机，入口木闸左立柱外侧的火盆，角色站在旁边" width="1280" height="720" fetchpriority="high">
        <figcaption>Godot 实机 · 入口火盆修好后</figcaption>
      </figure>
    </section>
    <div class="wrap review-shell">
      <aside class="sidebar" aria-label="验收导航">
        <p class="eyebrow">验收进度</p>
        <p id="progress" class="progress" aria-live="polite">加载中</p>
        <p class="review-history">轮次 08 的反馈已记入制作记录。</p>
        <nav id="sections" aria-label="验收项目"></nav>
        <aside class="play-guide">
          <h2>游戏内试玩</h2>
          <p>从主菜单进入「芬布尔之冬 · 冻石庭院」。</p>
          <dl>
            <div><dt><kbd>WASD</kbd></dt><dd>移动</dd></div>
            <div><dt><kbd>鼠标左键</kbd></dt><dd>朝光标挥砍</dd></div>
            <div><dt><kbd>空格</kbd></dt><dd>闪避</dd></div>
          </dl>
        </aside>
      </aside>
      <div id="work" class="work"></div>
    </div>
  </main>
  <template id="review-item">
    <section class="work-item">
      <header class="item-head">
        <div><h2></h2><p class="description"></p></div>
        <span class="item-status"></span>
      </header>
      <div class="evidence"></div>
      <form>
        <fieldset>
          <legend>验收结果</legend>
          <div class="decisions">
            <label><input type="radio" name="status" value="pending" checked><span>待验收</span></label>
            <label><input type="radio" name="status" value="approved"><span>通过</span></label>
            <label><input type="radio" name="status" value="revise"><span>需修改</span></label>
          </div>
        </fieldset>
        <label class="note-label">修改意见或验收备注<textarea name="note" rows="3" maxlength="3000" placeholder="填写需要调整的位置、问题和期望效果"></textarea></label>
        <div class="form-footer"><button type="submit">保存反馈</button><span class="save-result" role="status"></span></div>
      </form>
    </section>
  </template>
</body>
</html>
