<!doctype html><meta charset="utf-8"><title>第7批 C 三角色行走审核</title><style>body{background:#121721;color:#eee;font:14px sans-serif}section{display:inline-block;vertical-align:top;width:420px;padding:14px}img,canvas{image-rendering:pixelated}canvas{margin:8px}button{margin:4px}</style><h1>C 三角色行走：1× / 4× / 8fps</h1><p>仅素材审核，未在Godot测试。可暂停并逐帧检查。</p><main></main><script>
const jobs=[['annie_move','v03',6,8],['lanling_move','v02',6,8],['merlin_move','v02',6,8]];
for(const[id,v,n,fps]of jobs){const s=document.createElement('section');s.innerHTML='<h2>'+id+'</h2>';const image=new Image();image.src='../candidates/'+id+'_'+v+'.png';let k=0,run=true;const small=document.createElement('canvas');small.width=small.height=64;const big=document.createElement('canvas');big.width=big.height=256;const label=document.createElement('span');const paint=()=>{for(const c of[small,big]){const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);x.drawImage(image,k*64,0,64,64,0,0,c.width,c.height)}label.textContent='帧 '+(k+1)+' / '+n};image.onload=paint;s.append(small,big,label);for(const[t,fn]of[['暂停/继续',()=>run=!run],['下一帧',()=>{run=false;k=(k+1)%n;paint()}]]){const b=document.createElement('button');b.textContent=t;b.onclick=fn;s.append(b)}setInterval(()=>{if(run&&image.complete){k=(k+1)%n;paint()}},1000/fps);document.querySelector('main').append(s)}
</script>
