<!doctype html><meta charset="utf-8"><title>第5批行走逐帧审核</title><style>body{background:#121721;color:#e0e7ef;font:14px sans-serif}section{display:inline-block;vertical-align:top;width:460px;margin:8px}canvas,img{image-rendering:pixelated}canvas{margin:3px}button{margin:4px}</style><h1>第5批 第1关敌人行走 · 1× /4× /8fps</h1><p>站姿对照、循环和暂停逐帧。仅素材检查，未游戏实测。</p><main></main><script>const jobs=[{"id": "draugr_move", "path": "../candidates/draugr_move_v01.png", "reference": "../references/draugr.png", "n": 6, "w": 64, "h": 64}, {"id": "draugr_elite_move", "path": "../candidates/draugr_elite_move_v02.png", "reference": "../references/draugr_elite.png", "n": 6, "w": 64, "h": 64}, {"id": "ice_spirit_elite_move", "path": "../candidates/ice_spirit_elite_move_v01.png", "reference": "../references/ice_spirit_elite.png", "n": 4, "w": 64, "h": 64}, {"id": "ice_spirit_move", "path": "../candidates/ice_spirit_move_v02.png", "reference": "../references/ice_spirit.png", "n": 4, "w": 64, "h": 64}, {"id": "frost_giant_move", "path": "../candidates/frost_giant_move_v02.png", "reference": "../references/frost_giant.png", "n": 6, "w": 96, "h": 96}, {"id": "frost_giant_elite_move", "path": "../candidates/frost_giant_elite_move_v02.png", "reference": "../references/frost_giant_elite.png", "n": 6, "w": 96, "h": 96}, {"id": "wolf_move", "path": "../candidates/wolf_move_v04.png", "reference": "../references/wolf.png", "n": 4, "w": 64, "h": 64}];
for(const j of jobs){const s=document.createElement('section');s.innerHTML='<h2>'+j.id+'</h2>';const ref=new Image();ref.src=j.reference;s.append(ref);const image=new Image();image.src=j.path;let k=0,run=true;const small=document.createElement('canvas');small.width=j.w;small.height=j.h;const big=document.createElement('canvas');big.width=j.w*4;big.height=j.h*4;const label=document.createElement('span');const paint=()=>{for(const c of[small,big]){const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);x.drawImage(image,k*j.w,0,j.w,j.h,0,0,c.width,c.height)}label.textContent='帧 '+(k+1)+' / '+j.n};image.onload=paint;s.append(small,big,label);for(const[t,fn]of[['暂停/继续',()=>run=!run],['下一帧',()=>{run=false;k=(k+1)%j.n;paint()}]]){const b=document.createElement('button');b.textContent=t;b.onclick=fn;s.append(b)}setInterval(()=>{if(run&&image.complete){k=(k+1)%j.n;paint()}},125);document.querySelector('main').append(s)}
</script>
